name: 產生商品靜態頁面

# 跟現有的價格監控排程是同一套邏輯：讀 Sheet → 產生檔案 → commit。
# 這支負責讀「商品」試算表，幫每個 SKU 產生 products/{sku}/index.html
# 供 Google 個別收錄，並更新 sitemap.xml。

on:
  schedule:
    # 每天台灣時間 08:00、14:00、20:00 各跑一次（cron 用 UTC，要減 8 小時）
    - cron: "0 0,6,12 * * *"
  workflow_dispatch: {} # 也可以在 GitHub Actions 頁面手動觸發，方便測試

permissions:
  contents: write # 要能把新增的 products/ 資料夾 commit 回倉庫

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取倉庫
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 執行商品頁產生腳本
        env:
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
        run: node scripts/generate-product-pages.js

      - name: 檢查是否有變動
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit 並 push 變動
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products/ sitemap.xml
          git commit -m "自動更新商品靜態頁面 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
